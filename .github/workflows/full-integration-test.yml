name: Full Integration Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run the available test suite
        run: mvn -B --no-transfer-progress verify --fail-at-end --file pom.xml
      - name: Test summary
        if: always()
        run: |
          echo 'This run validates the Java scaffold and controlled MCP fixture. Product integration tests are not implemented yet.' >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/test-summary.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-integration-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 14
          if-no-files-found: ignore
